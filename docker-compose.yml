services:
  db:
    image: postgis/postgis:16-3.4
    container_name: descartaai-db
    environment:
      POSTGRES_DB: descartaai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - descartaai-dados:/var/lib/postgresql/data

volumes:
  descartaai-dados:
